# lerobot-isaac-deploy/pixi.toml
# Active in standalone mode (this directory is a spun-out working tree).
# On the laptop, `pixi install` is the one-shot bootstrap — replaces the
# old laptop_bootstrap.sh from the training workspace.

[workspace]
name = "lerobot-isaac-deploy"
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
pip = "*"
rsync = "*"
# Pins to satisfy lerobot 0.5.1 constraints. Without them conda picks
# bleeding-edge versions and the pypi solve fails:
#   numpy>=2.0,<2.3         (conda would pick 2.4.x)
#   packaging>=24.2,<26.0   (conda would pick 26.x)
#   setuptools>=71,<81      (conda would pick 82.x)
numpy = ">=2.0,<2.3"
packaging = ">=24.2,<26"
setuptools = ">=71,<81"

[pypi-dependencies]
# Editable install of THIS package so console scripts get registered.
lerobot-isaac-deploy = { path = ".", editable = true }
# Sibling runner CLIs we orchestrate via subprocess.
# Source: https://github.com/kvgork/robot_data_runner
# Portable across desktop + laptop. Swap to ssh://git@github.com/...
# if the repo goes private.
robot-data-runner = { git = "https://github.com/kvgork/robot_data_runner.git", branch = "main" }
# Pinned to match the desktop training env (see CLAUDE.md of the training repo).
lerobot = { version = "==0.5.1", extras = ["smolvla"] }

[feature.test.dependencies]
pytest = ">=7"

[feature.test.tasks]
test = "pytest tests/ -v"

# --- Operator-facing tasks --------------------------------------------------
[tasks]
# One-shot setup: ensure workspace dirs + prefetch SmolVLM2 weights.
bootstrap = "li-deploy-bootstrap"

# Pre-fetch HF weights only (no pip install).
prefetch-weights = "li-deploy-bootstrap --skip-pip"

# Show CLI help.
help = "lerobot-isaac-deploy --help"

# Convenience shortcuts (pass extra args through):
#   pixi run session -- --winner /path/to/winner.json --execute
session    = "li-deploy-session"
sync-ckpt  = "li-deploy-sync-ckpt"
sync-eval  = "li-deploy-sync-eval"

# sync the LAST checkpoint of the most recent autoresearch winner.
# Reads outputs/eval/<latest-rerank>/winner.json from the training
# workspace, resolves the trial run-dir, rsyncs the latest ckpt AND
# the LeRobotDataset it was trained against. The dataset path is
# read from the matching .agent-state/<session-id>-ar/autoresearch/
# <slug>/program.json (sibling to the rerank dir on the desktop).
#   pixi run sync-winner
#   pixi run sync-winner -- --dry-run
sync-winner = """bash -c '
set -e
TRAIN_WS="${LEROBOT_ISAAC_TRAIN_WS:-$HOME/workspaces/lerobot-isaac-training}"
WINNER=$(ls -t "$TRAIN_WS"/outputs/eval/*-rerank/winner.json 2>/dev/null | head -1)
[ -n "$WINNER" ] || { echo "no winner.json under $TRAIN_WS/outputs/eval/*-rerank/" >&2; exit 2; }
echo "[sync-winner] $WINNER"

# Map: outputs/eval/<base>-rerank/winner.json
#   ↔ .agent-state/<base>-ar/autoresearch/<slug>/program.json
RERANK_DIR=$(dirname "$WINNER")
RERANK_NAME=$(basename "$RERANK_DIR")
BASE_NAME="${RERANK_NAME%-rerank}"
AR_GLOB="$TRAIN_WS/.agent-state/${BASE_NAME}-ar/autoresearch/*/program.json"
PROGRAM=$(ls -t $AR_GLOB 2>/dev/null | head -1)
DATASET_ARG=""
if [ -n "$PROGRAM" ]; then
    REL_DATASET=$(python3 -c "import json,sys;d=json.load(open(\\"$PROGRAM\\"));print(d.get(\\"dataset\\",\\"\\"))" 2>/dev/null || true)
    if [ -n "$REL_DATASET" ]; then
        DATASET_ABS="$TRAIN_WS/$REL_DATASET"
        if [ -d "$DATASET_ABS" ]; then
            echo "[sync-winner] dataset → $DATASET_ABS"
            DATASET_ARG="--dataset-root $DATASET_ABS"
        else
            echo "[sync-winner] WARN: dataset path from program.json does not exist on disk: $DATASET_ABS" >&2
        fi
    else
        echo "[sync-winner] WARN: program.json had no dataset field: $PROGRAM" >&2
    fi
else
    echo "[sync-winner] WARN: no program.json under $AR_GLOB — skipping dataset rsync" >&2
fi

li-deploy-sync-ckpt --winner "$WINNER" $DATASET_ARG "$@"
' --"""

# Run the most recently-synced winner on the SO-101 (LAPTOP-side).
# Finds the newest models/<run>/winner.json, hands it to li-deploy-session.
# Add `-- --execute` to actually move motors. Default is the safer
# preflight + dry-run-loop path. The rewritten winner.json carries
# `dataset_root` so no --dataset-root flag is needed.
#   pixi run deploy-winner                          # preflight only
#   pixi run deploy-winner -- --dry-run-loop --yes  # inference loop, no motors
#   pixi run deploy-winner -- --execute             # motor writes (requires SO-101)
deploy-winner = """bash -c '
set -e
DEPLOY_BASE="$(pwd)"
WINNER=$(ls -t "$DEPLOY_BASE"/models/*/winner.json 2>/dev/null | head -1)
[ -n "$WINNER" ] || { echo "no winner.json under $DEPLOY_BASE/models/*/. Run pixi run sync-winner from desktop first." >&2; exit 2; }
echo "[deploy-winner] $WINNER"
li-deploy-session --winner "$WINNER" "$@"
' --"""

[environments]
default = { features = ["test"], solve-group = "default" }
