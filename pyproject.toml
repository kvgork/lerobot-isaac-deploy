[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot-isaac-deploy"
version = "0.1.0"
description = "Laptop-side deploy session orchestrator for SO-101 trained policies. Wraps robot-data-runner with a confirm-gated dry→1°→3°→closed-loop ladder."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Koen van Gorkom", email = "kvgorkom@smart-robotics.nl" }]
requires-python = ">=3.10"
keywords = ["lerobot", "so101", "robot", "deploy", "imitation-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Standalone — only hard dep is the runner CLI on PATH at runtime.
# numpy is the smallest dep we use directly (for shape checks); rsync is
# called as a subprocess.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6",
]

[project.scripts]
# One entrypoint with subcommands: `lerobot-isaac-deploy session ...`
# Keep individual aliases for muscle-memory parity with the bash scripts.
lerobot-isaac-deploy = "lerobot_isaac_deploy.cli:main"
li-deploy-session    = "lerobot_isaac_deploy.cli:session_main"
li-deploy-sync-ckpt  = "lerobot_isaac_deploy.cli:sync_ckpt_main"
li-deploy-sync-eval  = "lerobot_isaac_deploy.cli:sync_eval_main"
li-deploy-bootstrap  = "lerobot_isaac_deploy.cli:bootstrap_main"
li-deploy-wm-rollout = "lerobot_isaac_deploy.cli:wm_rollout_main"
li-deploy-kind       = "lerobot_isaac_deploy.cli:kind_main"

[project.optional-dependencies]
test = ["pytest>=7"]
runner = ["robot-data-runner>=0.1.0"]
dreamerv3 = ["sheeprl>=0.5", "torch>=2.0"]
lewm = ["lerobot>=0.5", "torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_isaac_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
